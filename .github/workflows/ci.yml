name: Validate LeadPilot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadpilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: leadpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadpilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r backend/requirements.txt
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: python -m pytest -q
        working-directory: backend
      - run: pnpm typecheck && pnpm lint && pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Start API against PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://leadpilot:ci-only-password@localhost:5432/leadpilot
        run: |
          python -m alembic upgrade head
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/leadpilot-api.log 2>&1 &
      - name: Start production frontend
        working-directory: frontend
        run: pnpm exec next start --hostname 127.0.0.1 > /tmp/leadpilot-web.log 2>&1 &
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health && curl -sf http://127.0.0.1:3000 > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: pnpm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
